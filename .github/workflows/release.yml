name: Otomatik Release

on:
  push:
    branches:
      - main # Main branch'ine her kod gönderdiğinizde tetiklenir

jobs:
  release:
    runs-on: windows-latest # Windows'ta derleme yapıyorsanız windows-latest daha sağlıklıdır
    permissions:
      contents: write

    steps:
      - name: Kodları Kopyala
        uses: actions/checkout@v4

      # BURAYA KENDİ BUILD ADIMINIZI EKLEYİN
      # Örneğin:
      # - name: Setup .NET
      #   uses: actions/setup-dotnet@v4
      # - name: Publish
      #   run: dotnet publish -c Release -o ./output

      - name: Release'i Güncelle
        uses: ncipollo/release-action@v1
        with:
          tag: "latest" # Hep aynı tag'i kullanır, böylece sürekli güncellenir
          allowUpdates: true # Varsa üzerine yazar
          replacesArtifacts: true # Eskisini silip yenisini yükler
          artifacts: "*.exe" # Veya output dizininizdeki exe'nin yolu (örn: ./output/*.exe)
          name: "En Son Sürüm"
          body: "Bu sürüm otomatik olarak en son push işleminden oluşturulmuştur."
          token: ${{ secrets.GITHUB_TOKEN }}